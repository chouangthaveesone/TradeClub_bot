name: CDC ActionZone Alert Bot

on:
  schedule:
    # ໃຫ້ເຮັດວຽກທຸກໆ 15 ນາທີ (ຫຼື ປັບຕາມ Timeframe ທີ່ເທຣດ)
    - cron: '*/15 * * * *'
  workflow_dispatch: # ປຸ່ມກົດ Run Manual ໄດ້ເອງ

jobs:
  run-alert-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance binance-connector
          pip install git+https://github.com/twopirllc/pandas-ta.git

      - name: Run Alert Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
